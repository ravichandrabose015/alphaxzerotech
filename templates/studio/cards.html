{% for item in records %}<a class="card reveal" href="{{ url_for('studio.preview_item',item_id=item.id) if preview else url_for('studio.detail',item_id=item.id) }}"><div class="card-top"><span class="card-symbol" aria-hidden="true">{{ symbols[loop.index0 % symbols|length] if symbols is defined else '◇' }}</span><span class="arrow">↗</span></div><span class="eyebrow">{{ item.label or item.kind }}</span><h3>{{ item.title }}</h3><p>{{ item.summary }}</p><span class="card-link">Explore {{ 'course' if item.kind=='course' else 'details' }} →</span></a>{% endfor %}
