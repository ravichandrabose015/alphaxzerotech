{% extends 'admin/auth_base.html' %}{% block title %}Administrator Login{% endblock %}{% block content %}<form class="auth-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><span class="lock-symbol">●</span><span class="eyebrow">Private Administrator Access Only</span><h2>Welcome back</h2><p>Sign in to the protected AlphaX ZeroTech administrator panel.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><label>Two-Factor Authentication Code <span>(if enabled)</span><input name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><label class="check-row"><input type="checkbox" name="remember_me" value="1"> Remember Me</label><button class="submit-enquiry" type="submit">Secure Login <span>&rarr;</span></button><a class="back-link" href="{{ url_for('home.index') }}">&larr; Return to public website</a></form>{% endblock %}
