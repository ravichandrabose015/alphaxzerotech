<header class="ax-site-header" data-site-header>
  <div class="ax-nav-shell">
    <a class="ax-brand" href="{{ url_for('home.index') }}" aria-label="AlphaX ZeroTech home">
      <span class="ax-brand-logo"><img src="{{ url_for('static', filename='images/logo-transparent.png') }}?v=transparent-20261031" alt="AlphaX ZeroTech official logo"></span>
      <span class="ax-brand-copy"><span class="ax-brand-name"><strong>AlphaX</strong> <b>ZeroTech</b></span><small>SECURE BY INTELLIGENCE</small></span>
    </a>

    <button class="ax-nav-toggle" type="button" aria-expanded="false" aria-controls="ax-primary-navigation" aria-label="Open navigation" data-nav-toggle><span></span><span></span><span></span></button>

    <nav class="ax-primary-nav" id="ax-primary-navigation" aria-label="Primary navigation" data-primary-nav>
      <a class="{% if request.path in ['/', '/index.html', '/templates/index.html'] %}active{% endif %}" href="{{ url_for('home.index') }}">Home</a>
      <a class="{% if request.path.startswith('/services') or request.path == '/templates/services.html' %}active{% endif %}" href="{{ url_for('services.index') }}">Services</a>
      <a class="{% if request.path.startswith('/security-tools') or request.path in ['/security_tools.html', '/templates/security_tools.html'] %}active{% endif %}" href="{{ url_for('security_tools.marketplace') }}">Security Tools</a>
      <a class="{% if request.path.startswith('/courses') or request.path.startswith('/training') %}active{% endif %}" href="{{ url_for('content_hub.training') }}">Courses</a>
      <div class="ax-nav-dropdown {% if request.path.startswith('/threat-intelligence') or request.path in ['/research','/blog','/case-studies','/news','/downloads','/resources'] %}active{% endif %}" data-nav-dropdown>
        <button type="button" aria-expanded="false" data-dropdown-toggle>Incidents <span aria-hidden="true">⌄</span></button>
        <div class="ax-dropdown-menu" data-dropdown-menu>
          <a href="{{ url_for('content_hub.threats') }}"><span>◉</span><b>Threat Intelligence</b><i>›</i></a>

          <a href="{{ url_for('content_hub.blog') }}"><span>✎</span><b>Blog</b><i>›</i></a>
          <a href="{{ url_for('content_hub.case_studies') }}"><span>◇</span><b>Case Studies</b><i>›</i></a>
          <a href="{{ url_for('content_hub.news') }}"><span>◌</span><b>News</b><i>›</i></a>
          <a href="{{ url_for('content_hub.downloads') }}"><span>⇩</span><b>Downloads</b><i>›</i></a>
        </div>
      </div>
      <a class="{% if request.path.startswith('/about') or request.path == '/templates/about.html' %}active{% endif %}" href="{{ url_for('about.index') }}">About</a>
      <a class="{% if request.path.startswith('/contact') or request.path == '/templates/contact.html' %}active{% endif %}" href="{{ url_for('contact.index') }}">Contact</a>
    </nav>
  </div>
</header>
